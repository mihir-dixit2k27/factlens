name: FactLens CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: factlens
          POSTGRES_PASSWORD: factlens
          POSTGRES_DB: factlens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://factlens:factlens@localhost:5432/factlens_test
      LLM_PROVIDER: mock
      EMBEDDING_MODEL: all-MiniLM-L6-v2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: factlens/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r factlens/backend/requirements.txt
        working-directory: .

      - name: Lint (ruff)
        run: ruff check factlens/backend/app/
        continue-on-error: false

      - name: Type check (mypy)
        run: mypy factlens/backend/app/ --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests
        run: pytest factlens/backend/tests/unit/ -v --tb=short
        working-directory: .

      - name: Run integration tests
        run: pytest factlens/backend/tests/integration/ -v --tb=short
        working-directory: .

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: factlens/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: factlens/frontend

      - name: Type check
        run: npm run type-check
        working-directory: factlens/frontend
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: factlens/frontend
